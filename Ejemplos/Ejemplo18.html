<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="css/Ejemplo18.css" rel="stylesheet" type="text/css">
</head>
<body>
  <section>
    <header>
      <h1>Manejo de SECTION</h1>
    </header>
    <article>
      <h2>¿Cómo se usa?</h2>
      <p>
        El uso de la etiqueta &lt;section&gt; agrupa elementos según su contenido
        estableciendo, como su nombre lo dice, una sección. Esta etiqueta
        crea bloques a partir de diferentes elementos, donde se puede incluir
        un encabezado y un pie.
      </p>
    </article>
  </section>
</body>
</html>
